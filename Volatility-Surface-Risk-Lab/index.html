<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07101f">
  <meta name="description" content="Interactive volatility-surface, PCA, scenario, and option-portfolio risk laboratory.">
  <title>Volatility Surface Risk Lab</title>
  <style>
    html,body{margin:0;min-height:100%;background:#050b16;color:#f4f7ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;color:#9eb0cc}
    .loading strong{display:block;margin-bottom:8px;color:#f4f7ff;font-size:1.1rem}
  </style>
</head>
<body>
  <div class="loading" id="loading"><div><strong>Loading Volatility Surface Risk Lab…</strong><span>Preparing the interactive browser calculations.</span></div></div>
  <script>
  (() => {
    "use strict";
    fetch("./lab.html", { cache: "no-store" })
      .then((response) => {
        if (!response.ok) throw new Error(`Could not load lab.html (${response.status})`);
        return response.text();
      })
      .then((html) => {
        const scriptTag = '<script src="app.js?v=20260818-3"><\/script>';
        const enhancedTag = `${scriptTag}<script src="interaction-fix.js?v=20260818-5"><\/script><script src="label-polish.js?v=20260818-1"><\/script>`;
        const documentHtml = html.includes(scriptTag)
          ? html.replace(scriptTag, enhancedTag)
          : html.replace("</body>", '<script src="app.js?v=20260818-3"><\/script><script src="interaction-fix.js?v=20260818-5"><\/script><script src="label-polish.js?v=20260818-1"><\/script></body>');
        document.open();
        document.write(documentHtml);
        document.close();
      })
      .catch((error) => {
        const loading = document.getElementById("loading");
        if (loading) loading.innerHTML = `<div><strong>The lab could not be loaded.</strong><span>${error.message}</span></div>`;
        console.error(error);
      });
  })();
  </script>
</body>
</html>
